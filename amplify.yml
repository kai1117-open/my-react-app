version: 1
frontend:
  phases:
    preBuild:
      commands:
        # package-lock.json と package.json の整合を保つため install を使用
        # (新規依存追加直後でも package-lock.json の手動更新なしでビルドが通る)
        - npm install --no-audit --no-fund
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
